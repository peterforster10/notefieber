    <!-- Unter der Leiste: Brotkrume links, Anwesenheit und Knöpfe rechts -->
    <sc-if value="{{inSpace}}" hint-placeholder-val="{{ true }}">
    <div class="nf-pagebar">
      <div class="nf-topbar-start">
        <nav aria-label="Brotkrume" class="nf-breadcrumb">
          <ol>
            <sc-for list="{{crumbs}}" as="c" hint-placeholder-count="2">
              <li>
                <a href="#" onClick="{{c.go}}">{{c.title}}</a>
                <span class="nf-crumb-sep" aria-hidden="true">/</span>
              </li>
            </sc-for>
            <li><span aria-current="page">{{crumbCurrent}}</span></li>
          </ol>
        </nav>
      </div>
      <sc-if value="{{showPage}}" hint-placeholder-val="{{ true }}">
        <div class="nf-topbar-end">
          <!-- Speicherstatus: Gespeichert / Speichert … / Offline / Nur lesen (ersetzt den Offline-Hinweis über dem Inhalt) -->
          <span class="nf-save-status" data-state="{{save.state}}" title="{{save.hint}}" role="status" aria-live="polite">
            <sc-if value="{{save.isSaved}}" hint-placeholder-val="{{ true }}"><svg class="nf-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
            <sc-if value="{{save.isSaving}}" hint-placeholder-val="{{ false }}"><svg class="nf-icon nf-spin" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 105.5 5.5"></path></svg></sc-if>
            <sc-if value="{{save.isOffline}}" hint-placeholder-val="{{ false }}"><svg class="nf-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 12.5h7a3 3 0 00.6-5.94A4 4 0 004.6 5.6 3.5 3.5 0 004.5 12.5z"></path><path d="M2.5 2.5l11 11"></path></svg></sc-if>
            <sc-if value="{{save.isReadonly}}" hint-placeholder-val="{{ false }}"><svg class="nf-icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"></path><circle cx="8" cy="8" r="2"></circle></svg></sc-if>
            <span>{{save.text}}</span>
          </span>
          <!-- Anwesenheit: nur die anderen (man selbst steht oben rechts), ab vier Personen „+N“ -->
          <sc-if value="{{hasPresence}}" hint-placeholder-val="{{ true }}">
            <div class="nf-presence" role="img" aria-label="{{presenceLabel}}" title="{{presenceLabel}}">
              <sc-for list="{{presence}}" as="pr" hint-placeholder-count="2">
                <span style="background: {{pr.color}}" aria-hidden="true">{{pr.initials}}</span>
              </sc-for>
              <sc-if value="{{presenceMore}}" hint-placeholder-val="{{ false }}">
                <span class="nf-presence-more" aria-hidden="true">{{presenceMoreLabel}}</span>
              </sc-if>
            </div>
          </sc-if>
          <!-- Seite als Favorit dieses Spaces markieren -->
          <button type="button" class="nf-btn nf-btn-icon nf-btn-ghost nf-page-star" aria-pressed="{{pageFav.pressed}}" aria-label="{{pageFav.label}}" title="{{pageFav.label}}" onClick="{{pageFav.toggle}}">
            <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2l1.75 3.6 3.95.55-2.86 2.8.68 3.95L8 11.2l-3.52 1.9.68-3.95L2.3 6.35l3.95-.55z"></path></svg>
          </button>
          <!-- Kommentare (Ausblick): Spalte ein/aus, mit Zahl der offenen Kommentare -->
          <button type="button" class="nf-btn nf-btn-icon nf-btn-ghost {{commentsCls}}" aria-pressed="{{commentsPressed}}" aria-label="{{commentsLabel}}" title="{{commentsLabel}}" onClick="{{toggleComments}}">
            <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"></path></svg>
            <sc-if value="{{hasOpenComments}}" hint-placeholder-val="{{ true }}"><span class="nf-count" aria-hidden="true">{{openComments}}</span></sc-if>
          </button>
          <!-- Teilen und Rechte: zeigt, ob die Seite eigene Rechte hat -->
          <button type="button" class="nf-btn nf-share {{share.cls}}" aria-haspopup="dialog" aria-label="{{share.aria}}" title="{{share.aria}}" onClick="{{openRights}}">
            <sc-if value="{{share.restricted}}" hint-placeholder-val="{{ false }}"><svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 015 0v2"></path></svg></sc-if>
            <sc-if value="{{share.open}}" hint-placeholder-val="{{ true }}"><svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"></circle><path d="M1.5 13.5c.5-2.5 2.3-4 4.5-4s4 1.5 4.5 4"></path><path d="M10.5 3.2a2.5 2.5 0 010 4.6M12 9.8c1.3.6 2.2 1.9 2.5 3.7"></path></svg></sc-if>
            <span class="nf-btn-label">{{share.label}}</span>
          </button>
          <!-- Weitere Aktionen der Seite -->
          <div class="nf-page-actions">
            <button type="button" class="nf-btn nf-btn-icon nf-btn-ghost" aria-label="Weitere Aktionen" title="Weitere Aktionen" aria-haspopup="menu" aria-expanded="{{pageMenuExpanded}}" onClick="{{togglePageMenu}}">
              <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="12.5" cy="8" r="1.3" fill="currentColor" stroke="none"></circle></svg>
            </button>
            <sc-if value="{{pageMenuOpen}}" hint-placeholder-val="{{ false }}">
              <ul class="nf-menu nf-page-menu" role="menu" aria-label="Weitere Aktionen">
                <li role="none"><button type="button" role="menuitem" class="nf-menu-item" onClick="{{copyLink}}">
                  <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.75 9.25a3 3 0 004.24 0l2-2a3 3 0 00-4.24-4.24l-.75.75"></path><path d="M9.25 6.75a3 3 0 00-4.24 0l-2 2a3 3 0 004.24 4.24l.75-.75"></path></svg>
                  <span class="nf-menu-label">Link kopieren</span></button></li>
                <li role="none"><button type="button" role="menuitem" class="nf-menu-item" aria-haspopup="dialog" onClick="{{openInfo}}">
                  <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M8 7.2V11M8 5v.01"></path></svg>
                  <span class="nf-menu-label">Seiteninfo</span></button></li>
                <li role="none"><button type="button" role="menuitem" class="nf-menu-item" aria-haspopup="dialog" onClick="{{openVersions}}">
                  <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.5 1.5"></path></svg>
                  <span class="nf-menu-label">Versionen</span></button></li>
                <li role="none"><button type="button" role="menuitem" class="nf-menu-item" aria-haspopup="dialog" onClick="{{openExport}}">
                  <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v7.5M4.5 7L8 10.5 11.5 7"></path><path d="M3 11v2h10v-2"></path></svg>
                  <span class="nf-menu-label">Exportieren</span></button></li>
                <li role="none"><button type="button" role="menuitem" class="nf-menu-item" aria-haspopup="dialog" onClick="{{openTplSave}}">
                  <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"></rect><path d="M2.5 6h11M6 6v7.5"></path></svg>
                  <span class="nf-menu-label">Als Vorlage speichern</span></button></li>
                <li role="separator" class="nf-menu-separator"></li>
                <li role="none"><button type="button" role="menuitem" class="nf-menu-item" aria-haspopup="dialog" aria-disabled="{{pageActions.moveDisabled}}" onClick="{{pageActions.move}}">
                  <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h4l1.5 1.5h5.5v7h-11z"></path><path d="M7.5 9.5h4M9.75 7.75L11.5 9.5l-1.75 1.75"></path></svg>
                  <span class="nf-menu-label">Verschieben …</span></button></li>
                <li role="none"><button type="button" role="menuitem" class="nf-menu-item nf-menu-item-danger" aria-disabled="{{pageActions.trashDisabled}}" onClick="{{pageActions.trash}}">
                  <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.5 9h6l.5-9"></path></svg>
                  <span class="nf-menu-label">In den Papierkorb</span></button></li>
              </ul>
            </sc-if>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{vmode}}" hint-placeholder-val="{{ false }}">
        <div class="nf-topbar-end">
          <button type="button" class="nf-btn" onClick="{{vv.close}}">
            <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3.5M7.5 4L3.5 8l4 4"></path></svg>
            <span>Zurück zur Seite</span>
          </button>
        </div>
      </sc-if>
    </div>
    </sc-if>
