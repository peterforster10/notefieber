  <!-- Export: im Frontend vorerst ein Dialog mit Ausblick (E14); Versionen haben eine eigene Ansicht -->
  <sc-if value="{{soonOpen}}" hint-placeholder-val="{{ false }}">
    <div class="nf-overlay" onClick="{{closeDialogOnBackdrop}}">
      <div class="nf-dialog" role="dialog" aria-modal="true" aria-labelledby="soon-title">
        <div class="nf-dialog-head">
          <h2 id="soon-title" class="nf-dialog-title">{{soon.title}}</h2>
          <button type="button" class="nf-btn nf-btn-icon nf-dialog-close" aria-label="Schließen" onClick="{{closeDialog}}">
            <svg class="nf-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
          </button>
        </div>
        <div class="nf-dialog-body" style="padding-bottom: 24px">
          <div class="nf-dialog-soon">
            <svg class="nf-icon" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M8 7.2V11M8 5v.01"></path></svg>
            <p>{{soon.text}}</p>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
