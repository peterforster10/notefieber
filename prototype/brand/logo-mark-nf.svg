<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="NoteFieber">
  <!-- NF-Monogramm, zurückhaltend: ohne Fläche, dünner Rahmen und NF in Inter 600, beide im Grau des Schriftzugs (#1A2230).
       Als Bild kann eine SVG-Datei keine Webfonts laden; ohne installierte Inter greift die Systemschrift.
       In der Oberfläche ist das Zeichen deshalb ein HTML-Element mit der geladenen Inter. -->
  <rect x="0.625" y="0.625" width="30.75" height="30.75" rx="7.4" fill="none" stroke="#1A2230" stroke-width="1.25"/>
  <text x="16" y="20.6" text-anchor="middle" font-family="'Inter Variable', Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.4" fill="#1A2230">NF</text>
</svg>
