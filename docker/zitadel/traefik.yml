# Routen für Zitadel in der lokalen Entwicklung (Dienst zitadel-proxy in compose.yaml),
# siehe docs/LOCAL_SETUP.md. Zitadel v4 besteht aus zwei Programmen, die nach außen unter
# EINEM Ursprung erscheinen müssen (http://localhost:8080):
#   /ui/v2/login/…  → zitadel-login (Anmeldeseiten, Next.js)
#   /               → umgeleitet auf die Anmeldeseiten
#   alles andere    → zitadel (OIDC, Console, APIs; spricht HTTP/2 ohne TLS, „h2c“)
# Wie im offiziellen Compose-Beispiel von Zitadel, nur mit Datei statt Docker-Labels, damit
# Traefik keinen Zugriff auf den Docker-Socket braucht. Später übernimmt das der Ingress
# im K3s-Cluster.
http:
  routers:
    zitadel-root:
      rule: Path(`/`)
      entryPoints: [web]
      middlewares: [zitadel-root-rewrite]
      service: zitadel-login
      priority: 400
    zitadel-login:
      rule: PathPrefix(`/ui/v2/login`)
      entryPoints: [web]
      service: zitadel-login
      priority: 250
    zitadel-api:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: zitadel-api
      priority: 100

  middlewares:
    zitadel-root-rewrite:
      replacePath:
        path: /ui/v2/login/

  services:
    zitadel-api:
      loadBalancer:
        servers:
          - url: h2c://zitadel:8080
    zitadel-login:
      loadBalancer:
        servers:
          - url: http://zitadel-login:3000
