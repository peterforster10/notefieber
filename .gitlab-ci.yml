# CI auf GitLab (gitlab.com/peterforster101/notefieber). Das Repository liegt auf GitHub;
# .github/workflows/sync-to-gitlab.yml spiegelt main nach GitLab, dort läuft diese Pipeline.
#
# Drei Jobs, die parallel laufen (docs/LOCAL_SETUP.md, „CI (GitLab)“):
#   database  Migrationen und alle Datenbanktests (database/scripts/schema_test/ci.sh)
#   apps      Lint, Formatierung, Typprüfung, Unit-Tests, Lizenzprüfung und Build (pnpm check)
#   api       API-Tests gegen eine echte Datenbank mit Testdaten (pnpm test:db)

stages:
  - test

apps:
  stage: test
  image: node:24
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    NEXT_TELEMETRY_DISABLED: "1"
    GIT_DEPTH: "1"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  timeout: 20 minutes
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm check

api:
  stage: test
  image: node:24
  services:
    - name: postgres:18
      alias: postgres
      # Wie beim Job database: Anmelden ohne Passwort, nur im Netz dieses Jobs
      variables:
        POSTGRES_PASSWORD: ci
        POSTGRES_HOST_AUTH_METHOD: trust
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    PGHOST: postgres
    PGPORT: "5432"
    PGCONNECT_TIMEOUT: "5"
    # Login-Rolle der API aus local_login_roles.sql (Passwort nur für diese Wegwerf-Datenbank)
    API_TEST_DATABASE_URL: postgres://wiki_api:api-lokal@postgres:5432/wiki
    GIT_DEPTH: "1"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  timeout: 20 minutes
  before_script:
    # psql aus Debian (setup_test_db.sh spielt Rollen, Migrationen und Testdaten damit ein)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client > /dev/null
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - bash database/scripts/setup_test_db.sh
    - pnpm test:db

database:
  stage: test
  # psql und pg_dump in derselben Hauptversion wie der Server (pg_dump lehnt neuere Server ab).
  # Leerer Entrypoint: das Start-Skript des Images soll hier keinen Server starten.
  image:
    name: postgres:18
    entrypoint: [""]
  services:
    - name: postgres:18
      alias: postgres
      # Nur in diesem Job und nur im Netz des Jobs: Anmelden ohne Passwort. So laufen die
      # Skripte unverändert, die bewusst keine Passwörter setzen (roles_database.sql).
      variables:
        POSTGRES_PASSWORD: ci
        POSTGRES_HOST_AUTH_METHOD: trust
  variables:
    PGHOST: postgres
    PGPORT: "5432"
    PGCONNECT_TIMEOUT: "5"
    GIT_DEPTH: "1"
  timeout: 15 minutes
  script:
    - bash database/scripts/schema_test/ci.sh
