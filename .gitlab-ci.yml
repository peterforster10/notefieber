# CI auf GitLab (gitlab.com/peterforster101/notefieber). Das Repository liegt auf GitHub;
# .github/workflows/sync-to-gitlab.yml spiegelt main nach GitLab, dort läuft diese Pipeline.
#
# Derzeit nur die Datenbank: Migrationen und alle Datenbanktests, siehe
# database/scripts/schema_test/ci.sh und docs/LOCAL_SETUP.md („Tests ausführen“). Build,
# Lint und Lizenzprüfung der Apps kommen mit dem App-Code dazu (ROADMAP, M0).

stages:
  - test

database:
  stage: test
  # psql und pg_dump in derselben Hauptversion wie der Server (pg_dump lehnt neuere Server ab).
  # Leerer Entrypoint: das Start-Skript des Images soll hier keinen Server starten.
  image:
    name: postgres:18
    entrypoint: [""]
  services:
    - name: postgres:18
      alias: postgres
      # Nur in diesem Job und nur im Netz des Jobs: Anmelden ohne Passwort. So laufen die
      # Skripte unverändert, die bewusst keine Passwörter setzen (roles_database.sql).
      variables:
        POSTGRES_PASSWORD: ci
        POSTGRES_HOST_AUTH_METHOD: trust
  variables:
    PGHOST: postgres
    PGPORT: "5432"
    PGCONNECT_TIMEOUT: "5"
    GIT_DEPTH: "1"
  timeout: 15 minutes
  script:
    - bash database/scripts/schema_test/ci.sh
