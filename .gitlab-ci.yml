# CI auf GitLab (gitlab.com/peterforster101/notefieber). Das Repository liegt auf GitHub;
# .github/workflows/sync-to-gitlab.yml spiegelt main nach GitLab, dort läuft diese Pipeline.
#
# Zwei Jobs, die parallel laufen (docs/LOCAL_SETUP.md, „CI (GitLab)“):
#   database  Migrationen und alle Datenbanktests (database/scripts/schema_test/ci.sh)
#   apps      Lint, Formatierung, Typprüfung, Lizenzprüfung und Build des Monorepos (pnpm check)

stages:
  - test

apps:
  stage: test
  image: node:24
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    NEXT_TELEMETRY_DISABLED: "1"
    GIT_DEPTH: "1"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  timeout: 20 minutes
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm check

database:
  stage: test
  # psql und pg_dump in derselben Hauptversion wie der Server (pg_dump lehnt neuere Server ab).
  # Leerer Entrypoint: das Start-Skript des Images soll hier keinen Server starten.
  image:
    name: postgres:18
    entrypoint: [""]
  services:
    - name: postgres:18
      alias: postgres
      # Nur in diesem Job und nur im Netz des Jobs: Anmelden ohne Passwort. So laufen die
      # Skripte unverändert, die bewusst keine Passwörter setzen (roles_database.sql).
      variables:
        POSTGRES_PASSWORD: ci
        POSTGRES_HOST_AUTH_METHOD: trust
  variables:
    PGHOST: postgres
    PGPORT: "5432"
    PGCONNECT_TIMEOUT: "5"
    GIT_DEPTH: "1"
  timeout: 15 minutes
  script:
    - bash database/scripts/schema_test/ci.sh
