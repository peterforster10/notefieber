# Lokale Entwicklungsumgebung, siehe docs/LOCAL_SETUP.md.
# PostgreSQL 18, Garage (Dateien, S3) und Zitadel (Login, OIDC unter http://localhost:8080).
#
#   docker compose up -d --wait  starten (beim ersten Mal mit Rollen, Schema, Testdaten, Bucket,
#                                Zitadel-Instanz mit Testpersonen)
#   docker compose stop          anhalten, die Daten bleiben in den Volumes
#   docker compose down          Container entfernen, die Daten bleiben in den Volumes
#   docker compose down -v       Container UND Daten entfernen
#
# Einstellungen über Umgebungsvariablen oder eine Datei .env neben dieser Datei
# (nicht im Repository, siehe .gitignore). Alle Standardwerte sind nur für den eigenen
# Rechner gedacht, nie für einen Server.
#   PostgreSQL
#     POSTGRES_PASSWORD      Passwort des Superusers postgres (Standard: postgres-lokal)
#     NF_PG_PORT             Port auf dem eigenen Rechner (Standard: 5432)
#     NF_SEED                Testdaten beim ersten Start einspielen (Standard: true)
#     NF_PG_CONTAINER        Name des Containers (Standard: nf-pg18)
#     NF_PG_VOLUME           Name des Volumes mit den Daten (Standard: notefieber-pgdata)
#   Garage
#     NF_S3_PORT             Port der S3-API (Standard: 3900)
#     NF_GARAGE_ADMIN_PORT   Port der Admin-API (Standard: 3903)
#     NF_S3_BUCKET           Bucket (Standard: wiki)
#     NF_S3_ACCESS_KEY_ID    Zugangsschlüssel: GK + 24 Hexziffern
#     NF_S3_SECRET_ACCESS_KEY  Geheimnis: 64 Hexziffern
#     NF_GARAGE_ADMIN_TOKEN  Token der Admin-API (Standard: garage-admin-lokal)
#     NF_GARAGE_RPC_SECRET   Interner Schlüssel von Garage: 64 Hexziffern
#     NF_GARAGE_CONTAINER, NF_GARAGE_VOLUME_PREFIX  Namen (Standard: nf-garage, notefieber-garage)
#   Zitadel
#     NF_ZITADEL_PORT        Port auf dem eigenen Rechner (Standard: 8080)
#     NF_ZITADEL_VERSION     Version der Images zitadel und zitadel-login (Standard: v4.20.1)
#     NF_ZITADEL_ADMIN_PASSWORD  Passwort von zitadel-admin (Standard: NoteFieber-lokal-1)
#     NF_TEST_PASSWORD       Passwort aller Testpersonen (Standard: NoteFieber-lokal-1)
#     NF_WEB_URL             Adresse des Frontends für die Redirect-URLs (Standard: http://localhost:3000)
#     NF_ZITADEL_MASTERKEY   Schlüssel für Geheimnisse in der Datenbank: genau 32 Zeichen
#     NF_ZITADEL_DB_PASSWORD Passwort der Datenbankrolle zitadel (Standard: zitadel-lokal)
#     NF_ZITADEL_COOKIE_SECRET  Signiert die Cookies der Anmeldeseiten: mindestens 32 Zeichen
#     NF_ZITADEL_CONTAINER, NF_ZITADEL_LOGIN_CONTAINER, NF_ZITADEL_PROXY_CONTAINER,
#     NF_ZITADEL_VOLUME      Namen (Standard: nf-zitadel, nf-zitadel-login, nf-zitadel-proxy,
#                            notefieber-zitadel-bootstrap)
#     Passwörter, Masterkey und Port wirken nur beim allerersten Start (leere Datenbank zitadel).
name: notefieber

services:
  postgres:
    image: postgres:18.6
    container_name: ${NF_PG_CONTAINER:-nf-pg18}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-lokal}
      NF_SEED: ${NF_SEED:-true}
    ports:
      - "127.0.0.1:${NF_PG_PORT:-5432}:5432"   # nur auf dem eigenen Rechner, nicht im Netzwerk
    volumes:
      - pgdata:/var/lib/postgresql             # Daten (beim Image postgres:18.6 dieser Pfad)
      - ./database/scripts:/scripts:ro         # Rollen, Schema, Tests, Testdaten
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro   # nur beim ersten Start
    healthcheck:
      # Über TCP: Während der Ersteinrichtung lauscht PostgreSQL nur auf dem Socket,
      # „healthy“ heißt also: Rollen, Schema und Testdaten sind eingespielt.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d wiki"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: ${NF_GARAGE_CONTAINER:-nf-garage}
    environment:
      GARAGE_RPC_SECRET: ${NF_GARAGE_RPC_SECRET:-7270632d6e75722d6c6f6b616c2d6e6f74656669656265722d67617261676521}
      GARAGE_ADMIN_TOKEN: ${NF_GARAGE_ADMIN_TOKEN:-garage-admin-lokal}
    ports:
      - "127.0.0.1:${NF_S3_PORT:-3900}:3900"             # S3-API für die Apps
      - "127.0.0.1:${NF_GARAGE_ADMIN_PORT:-3903}:3903"   # Admin-API
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      # Das Image enthält nur das Garage-Programm, keine Shell; „garage status“ fragt den Knoten.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Einrichtung von Garage: Layout, Schlüssel, Bucket (docker/garage/init.sh). Ändert nichts,
  # wenn schon alles da ist, und bleibt danach wartend stehen; „healthy“ heißt: Garage nutzbar.
  garage-init:
    image: curlimages/curl:8.23.0
    init: true   # damit „stop“ sofort wirkt
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/garage-ready"]
      interval: 2s
      timeout: 2s
      retries: 60
    environment:
      GARAGE_ADMIN_TOKEN: ${NF_GARAGE_ADMIN_TOKEN:-garage-admin-lokal}
      GARAGE_CAPACITY: "10000000000"   # 10 GB, nur eine Angabe für die Verteilung, keine Grenze
      S3_BUCKET: ${NF_S3_BUCKET:-wiki}
      S3_KEY_NAME: wiki-lokal
      S3_ACCESS_KEY_ID: ${NF_S3_ACCESS_KEY_ID:-GK6e6f74656669656265720001}
      S3_SECRET_ACCESS_KEY: ${NF_S3_SECRET_ACCESS_KEY:-6c6f6b616c2d6e75722d7a756d2d656e747769636b656c6e2d67617261676521}
    volumes:
      - ./docker/garage/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]

  # Zitadel (Login, OIDC). Legt beim ersten Start selbst Datenbank und Rolle „zitadel“ im
  # selben PostgreSQL an (als Superuser postgres) und die erste Instanz mit der Organisation
  # NoteFieber, dem Admin und einem Dienstkonto für die Einrichtung (PAT im Volume).
  zitadel:
    image: ghcr.io/zitadel/zitadel:${NF_ZITADEL_VERSION:-v4.20.1}
    container_name: ${NF_ZITADEL_CONTAINER:-nf-zitadel}
    user: "0"   # schreibt die Zugangstokens ins Volume zitadel-bootstrap
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_MASTERKEY: ${NF_ZITADEL_MASTERKEY:-NoteFieberLokalMasterkey32Zeichn}
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${NF_ZITADEL_PORT:-8080}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
      # Datenbank: zitadel legt Rolle und Datenbank selbst an (Admin = postgres)
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${NF_ZITADEL_DB_PASSWORD:-zitadel-lokal}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-postgres-lokal}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Erste Instanz (nur beim allerersten Start)
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: NoteFieber lokal
      ZITADEL_FIRSTINSTANCE_ORG_NAME: NoteFieber
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${NF_ZITADEL_ADMIN_PASSWORD:-NoteFieber-lokal-1}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: nf-setup
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Einrichtung (zitadel-init)
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Anmeldeseiten (zitadel-login)
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_DEFAULTLANGUAGE: de
      # Voreinstellungen der Instanz (nur beim allerersten Start): Deutsch, keine
      # Selbstregistrierung, keine Aufforderung zur Zwei-Faktor-Einrichtung
      ZITADEL_DEFAULTINSTANCE_DEFAULTLANGUAGE: de
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_MFAINITSKIPLIFETIME: 0s
      # Anmeldeseiten v2 (eigener Container zitadel-login unter /ui/v2/login)
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:${NF_ZITADEL_PORT:-8080}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:${NF_ZITADEL_PORT:-8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:${NF_ZITADEL_PORT:-8080}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:${NF_ZITADEL_PORT:-8080}/ui/v2/login/login?samlRequest=
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 30s

  # Anmeldeseiten von Zitadel v4 (Next.js), spricht mit dem Token des login-client
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:${NF_ZITADEL_VERSION:-v4.20.1}
    container_name: ${NF_ZITADEL_LOGIN_CONTAINER:-nf-zitadel-login}
    user: "0"   # liest das Token aus dem Volume
    depends_on:
      zitadel:
        condition: service_healthy
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${NF_ZITADEL_COOKIE_SECRET:-NoteFieber-lokal-Cookie-Geheimnis-32+}
      CUSTOM_REQUEST_HEADERS: Host:localhost:${NF_ZITADEL_PORT:-8080},X-Forwarded-Proto:http
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs", "http://localhost:3000/ui/v2/login/healthy"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 20s

  # Ein Ursprung für Zitadel und seine Anmeldeseiten: http://localhost:8080
  # (Routen in docker/zitadel/traefik.yml)
  zitadel-proxy:
    image: traefik:v3.7.7
    container_name: ${NF_ZITADEL_PROXY_CONTAINER:-nf-zitadel-proxy}
    depends_on:
      zitadel:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/routes.yml
      - --ping=true
      - --log.level=WARN
    ports:
      - "127.0.0.1:${NF_ZITADEL_PORT:-8080}:80"
    volumes:
      - ./docker/zitadel/traefik.yml:/etc/traefik/routes.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Einrichtung von Zitadel: Projekt, Clients, Organisationen und Personen der Testdaten
  # (docker/zitadel/init.mjs). Ändert nichts, wenn schon alles da ist, und bleibt danach
  # wartend stehen; „healthy“ heißt: Anmelden als Testperson geht. Schreibt die Werte für
  # die Apps nach .local/zitadel.env.
  zitadel-init:
    image: node:24.11.1-alpine
    init: true   # damit „stop“ sofort wirkt
    depends_on:
      zitadel:
        condition: service_healthy
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      ZITADEL_EXTERNAL_HOST: localhost:${NF_ZITADEL_PORT:-8080}
      NF_TEST_PASSWORD: ${NF_TEST_PASSWORD:-NoteFieber-lokal-1}
      NF_WEB_URL: ${NF_WEB_URL:-http://localhost:3000}
    volumes:
      - ./docker/zitadel/init.mjs:/init.mjs:ro
      - zitadel-bootstrap:/zitadel/bootstrap:ro
      - ./.local:/out
    command: ["node", "/init.mjs"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/zitadel-ready"]
      interval: 2s
      timeout: 2s
      retries: 90

volumes:
  pgdata:
    # Fester Name statt notefieber_pgdata: Daten aus dem früheren „docker run“ bleiben nutzbar.
    name: ${NF_PG_VOLUME:-notefieber-pgdata}
  garage-meta:
    name: ${NF_GARAGE_VOLUME_PREFIX:-notefieber-garage}-meta
  garage-data:
    name: ${NF_GARAGE_VOLUME_PREFIX:-notefieber-garage}-data
  zitadel-bootstrap:
    name: ${NF_ZITADEL_VOLUME:-notefieber-zitadel-bootstrap}
